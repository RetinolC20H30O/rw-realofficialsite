<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RW Official Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="16x16" href="image/rwlogo.png">
<body class="has-bg-blur">
<button class="back-button" onclick="history.back()">Back</button>    
<style>
:root{
  --bg:#150d06;
  --brown-1:#2a1a0c;
  --brown-2:#432a13;
  --brown-3:#6b4522;
  --amber:#f4b223;
  --amber-lt:#ffe9a3;
  --dur:1.5s;              /* fill time — bump this to slow it down */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 35%,var(--brown-2),var(--bg) 70%);
  font-family:"Helvetica Neue",Arial,sans-serif;
  color:#f3e3c8;
  overflow:hidden;                       /* unlocked by JS */
}

/* ---------- PRELOADER ---------- */
#preloader{position:fixed;inset:0;z-index:9999;pointer-events:none}

/* wipe panels */
.panels{position:absolute;inset:0;display:flex}
.panels i{
  flex:1;
  background:linear-gradient(180deg,var(--brown-1),var(--bg));
  border-right:1px solid rgba(244,178,35,.05);
  transform:translateY(0);
  animation:wipe .85s cubic-bezier(.76,0,.24,1) forwards;
  animation-delay:calc(1.65s + var(--i) * .07s);
}
@keyframes wipe{to{transform:translateY(-101%)}}

/* warm glow behind the type */
.glow{
  position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(244,178,35,.20),transparent 62%);
  filter:blur(18px);
  animation:breathe 2.4s ease-in-out infinite,fadeOut .5s 1.5s forwards;
}
@keyframes breathe{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.12)}}

/* centred stack */
.core{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;padding:24px;
  animation:exit .55s cubic-bezier(.6,0,.2,1) 1.45s forwards;
}
@keyframes exit{to{opacity:0;filter:blur(10px);transform:translateY(-22px) scale(.96)}}
@keyframes fadeOut{to{opacity:0}}

/* masked word rise + shine sweep */
.headline{display:flex;flex-direction:column;align-items:center;gap:.06em}
.line{display:flex;gap:.3em;overflow:hidden;padding:.12em 0}
.line b{
  display:block;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(24px,6vw,58px);font-weight:600;
  letter-spacing:.015em;line-height:1.1;white-space:nowrap;
  background:linear-gradient(100deg,var(--amber) 0%,var(--amber-lt) 42%,var(--amber) 58%,#b9791a 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transform:translateY(110%);
  animation:
    rise .95s cubic-bezier(.16,1,.3,1) forwards,
    shine 1.8s ease-in-out infinite;
  animation-delay:calc(var(--i) * .085s), calc(.3s + var(--i) * .07s);
}
@keyframes rise{to{transform:translateY(0)}}
@keyframes shine{0%{background-position:170% 0}100%{background-position:-70% 0}}

/* progress rail */
.rail{
  position:relative;width:min(420px,66vw);height:2px;
  background:rgba(244,178,35,.14);overflow:visible;border-radius:2px;
  opacity:0;animation:soft .4s ease .45s forwards;
}
.rail::before{
  content:"";position:absolute;inset:0 100% 0 0;
  background:linear-gradient(90deg,var(--brown-3),var(--amber));
  border-radius:2px;
  animation:fill var(--dur) cubic-bezier(.65,.02,.2,1) .45s forwards;
}
.rail::after{                       /* leading glow dot */
  content:"";position:absolute;top:50%;left:0;width:9px;height:9px;
  margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--amber-lt);
  box-shadow:0 0 14px 4px rgba(244,178,35,.7);
  animation:dot var(--dur) cubic-bezier(.65,.02,.2,1) .45s forwards;
}
@keyframes fill{to{right:0}}
@keyframes dot{to{left:100%}}
@keyframes soft{to{opacity:1}}

.meta{
  display:flex;justify-content:space-between;width:min(420px,66vw);
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(243,227,200,.5);
  opacity:0;animation:soft .4s ease .6s forwards;
}
.pct{color:var(--amber);font-variant-numeric:tabular-nums}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="preloader">
  <div class="panels">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
    <i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
  </div>
  <div class="glow"></div>

  <div class="core">
    <div class="headline">
      <div class="line">
        <b style="--i:0">The</b><b style="--i:1">end</b><b style="--i:2">of</b>
      </div>
      <div class="line">
        <b style="--i:3">the</b><b style="--i:4">first</b><b style="--i:5">chapter.</b>
      </div>
    </div>
    <div class="rail"></div>
    <div class="meta"><span>Loading</span><span class="pct">0%</span></div>
  </div>
</div>

<script>
(function(){
  const pct = document.querySelector('.pct');
  const start = performance.now(), DUR = 1500, DELAY = 450;

  (function tick(now){
    const t = Math.min(Math.max(now - start - DELAY, 0) / DUR, 1);
    const eased = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;   // matches the bar
    pct.textContent = Math.round(eased * 100) + '%';
    if (t < 1) requestAnimationFrame(tick);
  })(performance.now());

  setTimeout(() => { document.body.style.overflow = 'auto'; }, 2000);
  setTimeout(() => document.getElementById('preloader')?.remove(), 2700);
})();
</script>
</body>
</html>
